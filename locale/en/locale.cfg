[mod-setting-name]
cde-time-percent=Time evolution (% of vanilla)
cde-pollution-percent=Pollution evolution (% of vanilla)
cde-tree-absorption-percent=Tree absorption reduction (% compensation)
cde-unit-kills-per-1000=Evolution per 1000 enemy kills (percentage points)
cde-spawner-reduction=Reduction per destroyed nest (percentage points)
cde-worm-reduction=Reduction per destroyed worm (percentage points)
cde-expansion-enabled=Evolution from base expansion
cde-expansion-per-chunk=Evolution per newly occupied chunk (percentage points)
cde-show-session-evolution=Show evolution change since joining
cde-tech-cap-enabled=Limit evolution by researched technologies

[mod-setting-description]
cde-tree-absorption-percent=At 100%, each pollution unit absorbed by trees cancels the effective evolution pressure of one produced pollution unit under the current Pollution evolution multiplier. Includes both passive tree absorption and pollution absorbed when trees are damaged.
cde-show-session-evolution=Shows each factor's contribution since you joined this session. Uses Stats GUI when installed; otherwise prints a report in chat every 10 game minutes. The baseline resets when you change surfaces.
cde-tech-cap-enabled=Caps evolution at the fraction of available finite technologies researched by the player force. Hidden, disabled, and infinite technologies are excluded.

