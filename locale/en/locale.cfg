[mod-setting-description]
cde-tree-absorption-percent=At 100%, each pollution unit absorbed by trees cancels the effective evolution pressure of one produced pollution unit under the current Pollution evolution multiplier. Includes both passive tree absorption and pollution absorbed when trees are damaged.
cde-session-report-mode=Collects and shows each factor's contribution since you joined when enabled. Choose chat or Stats GUI; the latter requires Stats GUI to be installed. The baseline resets when you change surfaces. Stats GUI abbreviations: T time, P pollution, Tr trees, K kills, N nests, W worms, X expansion. When the technology cap is enabled, its current limit appears after the evolution value.
cde-tech-cap-enabled=Caps evolution using a curved, weighted share of the player force's researched technologies. Combat technologies count three times as much as others. Hidden, disabled, and infinite technologies are excluded.

[string-mod-setting]
cde-session-report-mode-off=Off
cde-session-report-mode-chat=Chat
cde-session-report-mode-stats-gui=Stats GUI

