[mod-setting-name]
cde-time-percent=Эволюция от времени (% от ванильной)
cde-pollution-percent=Эволюция от загрязнения (% от ванильной)
cde-tree-absorption-percent=Снижение от поглощения деревьями (% компенсации)
cde-unit-kills-per-1000=Эволюция за 1000 убитых врагов (п.п.)
cde-spawner-reduction=Снижение за уничтоженное гнездо (п.п.)
cde-worm-reduction=Снижение за уничтоженного червя (п.п.)
cde-expansion-enabled=Эволюция от расширения базы
cde-expansion-per-chunk=Эволюция за новый занятый чанк (п.п.)
cde-session-report-mode=Отчёт об эволюции за сессию
cde-tech-cap-enabled=Ограничивать эволюцию изученными технологиями

[mod-setting-description]
cde-time-percent=3 означает 3% от стандартного вклада времени.
cde-pollution-percent=50 означает 50% от стандартного вклада загрязнения.
cde-tree-absorption-percent=100 означает: каждая единица загрязнения, поглощённая деревьями, отменяет вклад одной произведённой единицы загрязнения с учётом текущего множителя «Эволюция от загрязнения». Учитывается как обычное поглощение деревьями, так и дополнительное поглощение при повреждении деревьев загрязнением.
cde-unit-kills-per-1000=Добавка к давлению эволюции за каждые 1000 врагов, убитых силой игрока.
cde-spawner-reduction=Снижение давления эволюции за каждое уничтоженное игроком гнездо.
cde-worm-reduction=Снижение давления эволюции за каждого уничтоженного игроком вражеского червя/турель.
cde-expansion-enabled=Повышает эволюцию при первом появлении значимой постройки игрока в новом чанке.
cde-expansion-per-chunk=Добавка при первом занятии чанка производственной, добывающей, энергетической или оборонительной постройкой.
cde-session-report-mode=Собирает и показывает вклад каждого фактора с момента входа в игру, только когда включён. Выберите чат или Stats GUI (если установлен). При смене поверхности отсчёт начинается заново. Обозначения в Stats GUI: В — время, З — загрязнение, Д — деревья, У — убийства, Г — гнёзда, Ч — черви, Р — расширение. Если техпредел включён, его текущее значение показывается после уровня эволюции.
cde-tech-cap-enabled=Ограничивает эволюцию по нелинейной взвешенной доле изученных силой игрока технологий. Боевые технологии учитываются с тройным весом. Скрытые, отключённые и бесконечные технологии не учитываются.

[string-mod-setting]
cde-session-report-mode-off=Выключено
cde-session-report-mode-chat=Сообщение в чат
cde-session-report-mode-stats-gui=Stats GUI

