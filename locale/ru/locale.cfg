stats-capped=Evo __1__% / __10__% (Δ__2__) | В__3__ З__4__ Д__5__ У__6__ Г__7__ Ч__8__ Р__9__
header=Эволюция: __1__% (изменение __2__ п.п. с момента входа)
time=Время: __1__ п.п.
pollution=Загрязнение: __1__ п.п.
trees=Поглощение деревьями: __1__ п.п.
units=Убийства врагов: __1__ п.п.
spawners=Уничтоженные гнёзда: __1__ п.п.
worms=Уничтоженные черви: __1__ п.п.
expansion=Расширение базы: __1__ п.п.
cap=Предел от технологий: __1__ п.п. (текущий предел __2__%)
